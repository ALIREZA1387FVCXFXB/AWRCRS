<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>کارت ویزیت دیجیتال | تعمیرات موبایل</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#0b0f14;
      --bg1:#141b24;
      --bg2:#1f2a36;
      --card: rgba(255,255,255,.06);
      --text:#f5f7fb;
      --muted: rgba(245,247,251,.72);
      --edge:#cfd6df;
      --accent:#a9b2bf;
      --shadow: rgba(0,0,0,.55);
      --radius: 28px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    
    body{
      font-family: "Vazirmatn", sans-serif;
      background: var(--bg0);
      color: var(--text);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
      overflow-x:hidden;
      position: relative;
    }

    /* --- بخش پس‌زمینه متحرک (Floating Elements) --- */
    .bg-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .floating-icon {
      position: absolute;
      color: rgba(207, 214, 223, 0.07); /* خیلی کم رنگ برای اینکه مزاحم متن نشود */
      font-size: 3rem;
      animation: float-anim 15s linear infinite;
    }

    @keyframes float-anim {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }
/* ایجاد موقعیت‌های مختلف برای آیکون‌ها */
    .icon-1 { left: 10%; animation-duration: 18s; font-size: 4rem; }
    .icon-2 { left: 30%; animation-duration: 22s; animation-delay: 2s; }
    .icon-3 { left: 50%; animation-duration: 25s; animation-delay: 5s; }
    .icon-4 { left: 70%; animation-duration: 20s; animation-delay: 1s; }
    .icon-5 { left: 85%; animation-duration: 28s; animation-delay: 7s; }
    .icon-6 { left: 15%; animation-duration: 24s; animation-delay: 10s; }

    /* --- استایل کارت اصلی --- */
    .card-wrap{ position: relative; z-index: 1; width: min(430px, 100%); }

    .card{
      border-radius: var(--radius);
      padding: 30px 22px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 90px var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
    }

    .top{ text-align:center; margin-bottom: 10px; }

    .logo{
      width: 110px; height: 110px;
      border-radius: 24px;
      border: 1px solid rgba(207,214,223,0.3);
      padding: 8px;
      background: rgba(255,255,255,0.05);
      object-fit: contain;
      margin-bottom: 15px;
    }

    .name{ font-weight: 800; font-size: 1.6rem; margin-bottom: 5px; }
    .tagline{ color: var(--muted); font-size: .9rem; opacity: 0.8; }

    .divider{
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      margin: 20px 0;
    }

    .grid{ display: flex; flex-direction: column; gap: 12px; }

    .btn{
      display: flex; align-items: center; gap: 15px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      text-decoration: none; color: var(--text);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover{
      background: rgba(255,255,255,0.1);
      transform: translateY(-3px);
      border-color: var(--edge);
    }

    .btn .icon{
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: var(--edge);
    }

    .btn .label b{ display: block; font-size: 1rem; font-weight: 800; }
    .btn .label span{ font-size: 0.8rem; color: var(--muted); }

    .btn.primary{
      background: linear-gradient(135deg, rgba(207,214,223,0.15), rgba(255,255,255,0.05));
      border-color: rgba(207,214,223,0.3);
    }

    /* بخش لوکیشن */
    .location-box{
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.2);
      border-radius: 22px;
      border: 1px dashed rgba(255,255,255,0.15);
    }

    .loc-header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .loc-header h3{ font-size: 0.9rem; }
    
    .map-container{
      width: 100%; height: 160px;
      border-radius: 15px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .map-container iframe{ width: 100%; height: 100%; border: 0; }

    .footer{
      margin-top: 20px; text-align: center;
      font-size: 0.75rem; color: var(--muted); opacity: 0.5;
    }

    @media (max-width: 350px){
      .btn .label span { display: none; }
    }
  </style>
</head>

<body>

  <!-- پس‌زمینه متحرک با آیکون‌ها -->
  <div class="bg-container">
    <i class="fa-solid fa-mobile-screen icon-1 floating-icon"></i>
    <i class="fa-solid fa-laptop icon-2 floating-icon"></i>
    <i class="fa-solid fa-microchip icon-3 floating-icon"></i>
    <i class="fa-solid fa-tablet-screen-button icon-4 floating-icon"></i>
    <i class="fa-solid fa-screwdriver-wrench icon-5 floating-icon"></i>
    <i class="fa-solid fa-plug icon-6 floating-icon"></i>
  </div>

  <div class="card-wrap">
    <div class="card">
      
      <div class="top">
        <img class="logo" src="file_0000000015fc81f495267422ec47c74f.jpg" alt="Logo">
        <div class="name">تکنولوژی دیبا</div>
        <div class="tagline">مرکز تخصصی موبایل و لپ تاپ </div>
      </div>

      <div class="divider"></div>

      <div class="grid">
        <!-- واتساپ -->
        <a href="https://wa.me/989120000000" class="btn primary" target="_blank">
          <div class="icon"><i class="fab fa-whatsapp"></i></div>
          <div class="label">
            <b>واتساپ</b>
            <span>ارسال پیام مستقیم</span>
          </div>
        </a>

        <!-- تلگرام -->
        <a href="https://t.me/yourusername" class="btn" target="_blank">
          <div class="icon"><i class="fab fa-telegram"></i></div>
          <div class="label">
            <b>تلگرام</b>
            <span>گفتگوی آنلاین</span>
          </div>
        </a>

        <!-- ایمیل -->
        <a href="mailto:info@example.com" class="btn">
          <div class="icon"><i class="fa-regular fa-envelope"></i></div>
          <div class="label">
            <b>ایمیل</b>
            <span>info@example.com</span>
          </div>
        </a>
      </div>

      <!-- بخش لوکیشن -->
      <div class="location-box">
        <div class="loc-header">
          <h3><i class="fa-solid fa-location-dot"></i> موقعیت ما</h3>
          <a href="https://maps.app.goo.gl/YOUR_LINK" target="_blank" style="color: var(--edge); text-decoration: none; font-size: 0.8rem;">باز کردن نقشه</a>
        </div>
        <div class="map-container">
          <!-- جایگزین کردن لینک زیر با لینک Embed گوگل مپ خودتان -->
          <iframe 
            src="https://www.google.com/maps?q=YOUR_LOCATION_NAME&output=embed" 
            allowfullscreen="" 
            loading="lazy">
          </iframe>
        </div>
      </div>

      <div class="footer">
        © تمامی حقوق محفوظ است
      </div>

    </div>
  </div>

</body>
</html>
